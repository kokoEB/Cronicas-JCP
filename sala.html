<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crónicas de JCP - Sala Multijugador</title>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCKTXv8G0KFu8ZtEG29Vki_151K6Dd6-KA",
        authDomain: "cronicas-jcp.firebaseapp.com",
        projectId: "cronicas-jcp",
        storageBucket: "cronicas-jcp.firebasestorage.app",
        messagingSenderId: "490467126773",
        appId: "1:490467126773:web:eb8187601c1ee2f59fc4bc",
        measurementId: "G-ECP6K1JRZ2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db; window.doc = doc; window.setDoc = setDoc; window.getDoc = getDoc; window.updateDoc = updateDoc;
</script>

<style>
:root { --gold: #d5aa61; --gold-dark: #85602f; --background: #121114; --panel: #201d20; --text: #eee8dc; --muted: #aaa09a; }
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: radial-gradient(ellipse at top, #39302a 0%, #171518 48%, #0d0c0e 100%); color: var(--text); font-family: Georgia, serif; min-height: 100vh; }
header { text-align: center; margin-bottom: 25px; }
header h1 { color: var(--gold); margin: 0 0 5px 0; font-size: 32px; text-shadow: 0 3px 15px #000; }
header p { color: var(--muted); font-style: italic; }
.container { max-width: 600px; margin: auto; }
.section { background: linear-gradient(145deg, #282326, #1b191c); border: 1px solid var(--gold-dark); border-radius: 10px; padding: 22px; margin-bottom: 22px; box-shadow: 0 8px 20px #0005; }
.section h2 { color: var(--gold); border-bottom: 1px solid #725536; padding-bottom: 10px; margin-top: 0; }
label { display: block; color: var(--gold); margin: 14px 0 7px; }
input, select { width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #625344; background: #151316; color: var(--text); font-size: 15px; }
.btn-gold { background: linear-gradient(135deg, #c99c55, #8c642f); color: #17120d; font-weight: bold; border: none; padding: 12px 18px; border-radius: 5px; cursor: pointer; font-size: 15px; margin-top: 12px; width: 100%; }
.btn-gold:hover { filter: brightness(1.15); }
.info-box { background: #151316; border: 1px solid #625344; padding: 14px; border-radius: 6px; margin-bottom: 15px; }
.info-box strong { color: var(--gold); }
</style>
</head>
<body>

<header>
    <h1>🚪 SALA DE PARTIDA 🚪</h1>
    <p>Conectá con tus amigos en línea</p>
</header>

<main class="container">
    <section class="section">
        <h2>Gestión de Sala Multijugador</h2>
        
        <div class="info-box">
            <strong>Seleccionar Campaña Ramificada:</strong>
            <select id="campaignSelect" style="margin-top:8px;">
                <option value="story1">📖 Campaña 1: El Calabozo Subterráneo (Árbol D20)</option>
                <option value="story2">🌲 Campaña 2: El Bosque Encantado de Bestias</option>
                <option value="story3">🏚 Campaña 3: La Mansión Misteriosa del Pueblo</option>
            </select>
        </div>

        <div class="info-box">
            <strong>Seleccionar tu Héroe Creado:</strong>
            <select id="savedCharactersSelect" style="margin-top:8px;"></select>
            <button onclick="clearCharacters()" style="background: #9e3939; color:#fff; border:none; padding:8px; border-radius:5px; margin-top:10px; cursor:pointer; width:100%;">🗑 Borrar personajes guardados</button>
        </div>
        
        <div class="info-box">
            <strong>Crear Sala (Genera Código Automático):</strong>
            <button class="btn-gold" onclick="createNewRoom()" style="margin-top:8px;">🎲 Generar Sala y Código</button>
        </div>

        <div class="info-box">
            <strong>Unirse con Código:</strong>
            <input id="roomCodeInput" type="text" placeholder="CÓDIGO (EJ: JCP99)" style="text-transform:uppercase; margin-top:8px;">
            <button class="btn-gold" onclick="joinExistingRoom()" style="margin-top:8px;">🚪 Unirse a Sala</button>
        </div>

        <!-- Hipervínculo para volver a crear personaje -->
        <a href="index.html" style="display:block; text-align:center; border:1px solid var(--gold); color:var(--gold); padding:10px; border-radius:5px; text-decoration:none; margin-top:15px;">⬅ Volver a Crear Personaje</a>
    </section>
</main>

<script>
window.addEventListener("DOMContentLoaded", () => { loadSavedCharactersToLobby(); });

function loadSavedCharactersToLobby() {
    const select = document.getElementById("savedCharactersSelect");
    const saved = JSON.parse(localStorage.getItem("jcp_characters") || "[]");
    select.innerHTML = "";
    if (saved.length === 0) {
        select.innerHTML = '<option value="">No hay personajes creados</option>';
        return;
    }
    saved.forEach((char, index) => {
        select.innerHTML += `<option value="${index}">${char.characterName} (${char.selectedClass} - ${char.selectedRace})</option>`;
    });
}

function clearCharacters() {
    if (confirm("¿Borrar personajes guardados?")) {
        localStorage.removeItem("jcp_characters");
        loadSavedCharactersToLobby();
        alert("Personajes borrados.");
    }
}

async function createNewRoom() {
    const charIndex = document.getElementById("savedCharactersSelect").value;
    if (charIndex === "") { alert("Seleccioná un personaje."); return; }
    const saved = JSON.parse(localStorage.getItem("jcp_characters") || "[]");
    const myCharacter = saved[charIndex];
    
    const code = Math.random().toString(36).substring(2, 7).toUpperCase();
    const campaignId = document.getElementById("campaignSelect").value;

    const roomData = { 
        roomCode: code, 
        players: [myCharacter], 
        currentNodeId: "start",
        gameStarted: false, 
        chat: [],
        campaignId: campaignId,
        monsterHp: 0,
        monsterMaxHp: 0,
        monsterName: "",
        turnIndex: 0,
        combatTurnCounter: 0
    };
    try {
        await window.setDoc(window.doc(window.db, "rooms", code), roomData);
        localStorage.setItem("jcp_active_character", JSON.stringify(myCharacter));
        window.location.href = `game.html?room=${code}`;
    } catch (e) { alert("Error Firebase: " + e.message); }
}

async function joinExistingRoom() {
    const code = document.getElementById("roomCodeInput").value.trim().toUpperCase();
    const charIndex = document.getElementById("savedCharactersSelect").value;
    if (!code || charIndex === "") { alert("Ingresá el código de sala y elegí tu personaje."); return; }
    const saved = JSON.parse(localStorage.getItem("jcp_characters") || "[]");
    const myCharacter = saved[charIndex];

    try {
        const roomRef = window.doc(window.db, "rooms", code);
        const roomSnap = await window.getDoc(roomRef);
        if (!roomSnap.exists()) { alert("La sala no existe. Verificá el código."); return; }
        let roomData = roomSnap.data();
        
        if (roomData.players.length >= 5) {
            alert("❌ Lo siento, esta sala ya alcanzó el límite máximo de 5 jugadores.");
            return;
        }

        roomData.players.push(myCharacter);
        const pCount = roomData.players.length;
        const campaignsData = {
            story1: { baseHp: 85, isBoss: true },
            story2: { baseHp: 85, isBoss: true },
            story3: { baseHp: 85, isBoss: true }
        };
        const camp = roomData.campaignId || "story1";
        const scaledHp = campaignsData[camp].baseHp + (pCount - 1) * 20;
        roomData.monsterHp = Math.min(roomData.monsterHp || scaledHp, scaledHp);
        roomData.monsterMaxHp = scaledHp;

        await window.updateDoc(roomRef, { players: roomData.players, monsterHp: roomData.monsterHp, monsterMaxHp: roomData.monsterMaxHp });
        
        localStorage.setItem("jcp_active_character", JSON.stringify(myCharacter));
        window.location.href = `game.html?room=${code}`;
    } catch (e) { alert("Error: " + e.message); }
}
</script>
</body>
</html>
